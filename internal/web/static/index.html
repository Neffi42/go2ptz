<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<title>go2ptz</title>
<script>
  // Before first paint, so a forced theme never flashes the system one.
  try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115; --panel: #181b21; --line: #2a2f38; --line-hover: #3a4150; --fg: #e6e8eb; --muted: #8b929c;
    --accent: #4f8cff; --on-accent: #fff; --danger: #e5484d; --ok: #30a46c; --btn: #222631; --sunken: #0b0d10;
    --shadow: none;
    --pad: 60px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f4f5f7; --panel: #ffffff; --line: #dcdfe4; --line-hover: #b9bec7; --fg: #16181d; --muted: #5f6672;
      --accent: #2f6fe4; --on-accent: #fff; --danger: #cd2b31; --ok: #218358; --btn: #eef0f3; --sunken: #e9ebef;
      --shadow: 0 1px 2px rgb(0 0 0 / .05);
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f5f7; --panel: #ffffff; --line: #dcdfe4; --line-hover: #b9bec7; --fg: #16181d; --muted: #5f6672;
    --accent: #2f6fe4; --on-accent: #fff; --danger: #cd2b31; --ok: #218358; --btn: #eef0f3; --sunken: #e9ebef;
    --shadow: 0 1px 2px rgb(0 0 0 / .05);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  main {
    max-width: 1100px; margin: 0 auto; display: grid; gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  header { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  header h1 { font-size: 15px; margin: 0; color: var(--fg); font-weight: 600; }
  header #statusText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #theme { margin-left: auto; flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
  #theme svg { width: 16px; height: 16px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); flex: none; }
  .dot.ok { background: var(--ok); }

  #video { aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
  #video video-stream, #video video { width: 100%; height: 100%; display: block; }

  .controls { display: grid; gap: 12px; grid-template-columns: auto 1fr; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; box-shadow: var(--shadow); }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }

  button, .btn {
    background: var(--btn); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 12px; font: inherit; cursor: pointer; text-decoration: none; text-align: center;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button:disabled { opacity: .5; cursor: default; }
  @media (hover: hover) { button:hover, .btn:hover { border-color: var(--line-hover); } }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.danger { color: var(--danger); }

  .ptz { display: grid; gap: 12px; justify-items: center; }
  .pad { display: grid; grid-template-columns: repeat(3, var(--pad)); grid-template-rows: repeat(3, var(--pad)); gap: 6px; }
  .pad button {
    padding: 0; font-size: 20px; line-height: 1; touch-action: none; -webkit-touch-callout: none;
    display: grid; place-items: center; /* inline SVGs otherwise sit on the text baseline */
  }
  .pad button.held { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .pad .up { grid-area: 1 / 2; } .pad .left { grid-area: 2 / 1; } .pad .snap { grid-area: 2 / 2; }
  .pad .right { grid-area: 2 / 3; } .pad .down { grid-area: 3 / 2; }
  .pad .snap svg { width: 24px; height: 24px; display: block; }
  label.speed { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 8px; width: 100%; }
  label.speed input { flex: 1; accent-color: var(--accent); }

  input[type=text] {
    background: var(--sunken); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px; font: inherit; font-size: 16px; /* >=16px stops iOS zoom-on-focus */ min-width: 0;
  }
  .row { display: flex; gap: 6px; }
  .row input { flex: 1; }
  ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; max-height: 260px; overflow: auto; }
  li { display: flex; gap: 6px; align-items: center; }
  li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li button { padding: 6px 12px; }

  /* minmax(0, …): otherwise long filenames overflow the card. */
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr)); gap: 10px; }
  .shot { min-width: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--sunken); display: flex; flex-direction: column; }
  .shot a.img { position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
  .shot img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .shot.broken img { visibility: hidden; }
  .shot.broken a.img::after {
    content: 'Image unavailable'; position: absolute; inset: 0; display: grid; place-items: center;
    background: var(--sunken); color: var(--muted); font-size: 12px;
  }
  .shot .meta { padding: 6px 8px 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shot .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 6px 8px 8px; }
  .shot .actions > * {
    min-width: 0; padding: 6px 8px; font-size: 13px; white-space: nowrap; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .shot .actions svg { width: 16px; height: 16px; flex: none; }
  #more { width: 100%; margin-top: 10px; }

  .hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
  @media (hover: none) { .hint { display: none; } }

  #toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom));
    max-width: calc(100% - 32px); background: var(--panel); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #toast.err { border-color: var(--danger); color: var(--danger); }

  @media (max-width: 640px) {
    :root { --pad: 68px; }
    main { padding-left: 0; padding-right: 0; gap: 10px; }
    header, .controls, .panel.snapshots { margin: 0 max(10px, env(safe-area-inset-left)); }
    #video { border-radius: 0; }
    .controls { grid-template-columns: 1fr; }
    .shots { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .shot .actions .label { display: none; } /* icons only on narrow cards */
    .shot .actions > * { padding: 8px; }
  }
</style>
<script type="module" src="go2rtc/video-stream.js"></script>
</head>
<body>
<main>
  <header>
    <span class="dot" id="status"></span><h1>go2ptz</h1><span id="statusText">connecting…</span>
    <button id="theme" type="button" aria-label="Theme"></button>
  </header>

  <div id="video"></div>

  <div class="controls">
    <section class="panel ptz">
      <div class="pad">
        <button class="up" data-move="0,1" aria-label="Tilt up">↑</button>
        <button class="left" data-move="-1,0" aria-label="Pan left">←</button>
        <button class="snap primary" id="snap" aria-label="Take snapshot" title="Snapshot (s)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <button class="right" data-move="1,0" aria-label="Pan right">→</button>
        <button class="down" data-move="0,-1" aria-label="Tilt down">↓</button>
      </div>
      <label class="speed">Speed <input type="range" id="speed" min="0.1" max="1" step="0.1" value="0.5"></label>
    </section>

    <section class="panel">
      <h2>Presets</h2>
      <form class="row" id="saveForm">
        <input type="text" id="presetName" placeholder="Name" maxlength="64" required enterkeyhint="done">
        <button type="submit">Save here</button>
      </form>
      <ul id="presets"></ul>
    </section>
  </div>

  <section class="panel snapshots">
    <h2>Snapshots</h2>
    <div class="shots" id="shots"></div>
    <button id="more" hidden>Load more</button>
    <p class="hint">Keyboard: arrow keys to pan/tilt, s for snapshot.</p>
  </section>
</main>
<div id="toast"></div>

<script type="module">
  const $ = (s) => document.querySelector(s);

  // Player: go2rtc's <video-stream>, proxied by the sidecar, stream pinned server-side.
  customElements.whenDefined('video-stream').then(() => {
    const v = document.createElement('video-stream');
    v.mode = 'webrtc,mse,mjpeg';
    v.src = new URL('go2rtc/api/ws', location.href);
    $('#video').append(v);
  });

  let toastTimer;
  function toast(msg, err = false) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'show' + (err ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.className = ''), 2500);
  }

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) throw new Error((await res.text()).trim() || res.statusText);
    return res.status === 204 ? null : res.json();
  }
  const run = (p) => p.catch((e) => toast(e.message, true));

  // Continuous moves: the server bounds each move to 2s, so re-send while held.
  const speed = () => Number($('#speed').value);
  let held = null, heartbeat = null;
  function start([pan, tilt], btn) {
    if (held) return;
    held = btn ?? true;
    btn?.classList.add('held');
    navigator.vibrate?.(10);
    const send = () => run(api('POST', 'api/move', { pan: pan * speed(), tilt: tilt * speed() }));
    send();
    heartbeat = setInterval(send, 1000);
  }
  function stop() {
    if (!held) return;
    if (held instanceof Element) held.classList.remove('held');
    held = null;
    clearInterval(heartbeat);
    run(api('POST', 'api/stop'));
  }

  for (const b of document.querySelectorAll('[data-move]')) {
    const vec = b.dataset.move.split(',').map(Number);
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); start(vec, b); });
    b.addEventListener('pointerup', stop);
    b.addEventListener('pointercancel', stop);
    b.addEventListener('lostpointercapture', stop);
    b.addEventListener('contextmenu', (e) => e.preventDefault()); // long-press menu on mobile
  }
  window.addEventListener('blur', stop);
  document.addEventListener('visibilitychange', () => document.hidden && stop());

  const keys = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  let heldKey = null;
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input')) return;
    if (keys[e.key]) {
      e.preventDefault();
      if (!e.repeat && !held) { heldKey = e.key; start(keys[e.key]); }
    } else if (e.key === 's') snapshot();
  });
  document.addEventListener('keyup', (e) => { if (e.key === heldKey) { heldKey = null; stop(); } });

  async function loadPresets() {
    const list = $('#presets');
    const presets = await api('GET', 'api/presets');
    if (!presets?.length) {
      list.replaceChildren(Object.assign(document.createElement('li'), { className: 'hint', textContent: 'No presets' }));
      return;
    }
    list.replaceChildren(...presets.map((p) => {
      const li = document.createElement('li');
      const name = Object.assign(document.createElement('span'), { className: 'name', textContent: p.Name || p.Token });
      const go = Object.assign(document.createElement('button'), { textContent: 'Go' });
      go.onclick = () => run(api('POST', `api/presets/${encodeURIComponent(p.Token)}/goto`));
      const del = Object.assign(document.createElement('button'), { textContent: '✕', className: 'danger', title: 'Delete' });
      del.setAttribute('aria-label', `Delete preset ${name.textContent}`);
      del.onclick = () => confirm(`Delete preset "${name.textContent}"?`) &&
        run(api('DELETE', `api/presets/${encodeURIComponent(p.Token)}`).then(loadPresets));
      li.append(name, go, del);
      return li;
    }));
  }
  $('#saveForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('#presetName').value.trim();
    run(api('POST', 'api/presets', { name }).then(() => {
      $('#presetName').value = '';
      $('#presetName').blur();
      toast(`Saved "${name}"`);
      return loadPresets();
    }));
  });

  // Snapshots: newest first, 5 per page. The DOM is the cursor: offset = cards shown.
  const PAGE = 5;
  const shots = $('#shots');

  function shotTime(name) {
    const m = name.match(/^snapshot-(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)(?:\.(\d{3}))?Z\.jpg$/);
    if (!m) return name;
    const d = new Date(Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6], +(m[7] || 0)));
    return d.toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'medium' });
  }

  const ICON_DOWNLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
  const ICON_DELETE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

  function shotCard(name) {
    const url = 'snapshots/' + encodeURIComponent(name);
    const card = Object.assign(document.createElement('div'), { className: 'shot' });
    const link = Object.assign(document.createElement('a'), { className: 'img', href: url, target: '_blank', rel: 'noopener' });
    const when = shotTime(name);
    const img = Object.assign(document.createElement('img'), { src: url, loading: 'lazy', alt: `Snapshot ${when}` });
    img.onerror = () => card.classList.add('broken');
    link.append(img);
    const meta = Object.assign(document.createElement('div'), { className: 'meta', textContent: when, title: name });
    const save = Object.assign(document.createElement('a'), { className: 'btn', href: url + '?download', download: name, title: 'Download' });
    save.setAttribute('aria-label', 'Download snapshot');
    save.innerHTML = ICON_DOWNLOAD + '<span class="label">Download</span>';
    const del = Object.assign(document.createElement('button'), { className: 'danger', title: 'Delete' });
    del.setAttribute('aria-label', 'Delete snapshot');
    del.innerHTML = ICON_DELETE + '<span class="label">Delete</span>';
    del.onclick = () => confirm('Delete this snapshot?') &&
      run(api('DELETE', 'api/snapshots/' + encodeURIComponent(name)).then(() => {
        card.remove();
        if (!shots.children.length) loadShots();
      }));
    const actions = Object.assign(document.createElement('div'), { className: 'actions' });
    actions.append(save, del);
    card.append(link, meta, actions);
    return card;
  }

  async function loadShots() {
    const more = $('#more');
    more.disabled = true;
    try {
      const page = await api('GET', `api/snapshots?offset=${shots.children.length}&limit=${PAGE}`);
      shots.append(...page.names.map(shotCard));
      more.hidden = !page.more;
    } finally {
      more.disabled = false;
    }
  }
  $('#more').addEventListener('click', () => run(loadShots()));

  function snapshot() {
    const btn = $('#snap');
    btn.disabled = true;
    run(api('POST', 'api/snapshots').then((r) => {
      shots.prepend(shotCard(r.name));
      toast('Snapshot saved');
    })).finally(() => (btn.disabled = false));
  }
  $('#snap').addEventListener('click', snapshot);

  // Theme: system (default) → light → dark. Only an explicit choice is stored.
  const THEMES = ['system', 'light', 'dark'];
  const ICONS = {
    system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  };
  const themeBtn = $('#theme');
  function applyTheme(t) {
    if (t === 'system') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    themeBtn.innerHTML = ICONS[t] + `<span>${t[0].toUpperCase() + t.slice(1)}</span>`;
    themeBtn.title = `Theme: ${t} (click to change)`;
  }
  let theme = document.documentElement.dataset.theme || 'system';
  applyTheme(theme);
  themeBtn.addEventListener('click', () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    applyTheme(theme);
    try { theme === 'system' ? localStorage.removeItem('theme') : localStorage.setItem('theme', theme); } catch {}
  });

  // Readiness: camera may still be connecting at startup.
  let wasReady = false;
  async function poll() {
    let ready = false;
    try { ready = (await fetch('readyz')).ok; } catch {}
    $('#status').classList.toggle('ok', ready);
    $('#statusText').textContent = ready ? 'camera connected' : 'camera not connected';
    if (ready && !wasReady) run(loadPresets());
    wasReady = ready;
  }
  poll();
  setInterval(poll, 5000);
  run(loadShots());
</script>
</body>
</html>
